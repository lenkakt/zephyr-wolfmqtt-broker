# Memory report, add with -DEXTRA_CONF_FILE=mem_report.conf
CONFIG_APP_MEM_REPORT=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
# printk straight to the console, so the report isn't dropped
CONFIG_LOG_PRINTK=n
